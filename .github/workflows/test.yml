name: test

on:
  push:
    branches: [test-merge, development, main, dev-upgrade, bug-fix, SQL-DB, "velpari/**", "pi-velpari-wt-*", "herdr*"]
  pull_request:
    branches: [test-merge, development, main, dev-upgrade, bug-fix, SQL-DB, "velpari/**", "pi-velpari-wt-*", "herdr*"]
  workflow_dispatch:
    # Manual runs select ONE job family instead of always running everything.
    # Push/PR runs are unaffected: the `job` input is empty for them, and each
    # gated job keeps its existing behaviour through the
    # `github.event_name != 'workflow_dispatch'` arm. The default `all`
    # preserves what a bare `gh workflow run test.yml` did before this input
    # existed (documented in Doc/testing-guide.md).
    inputs:
      job:
        description: "Which manual job to run"
        type: choice
        default: all
        options: [all, tier2, tier3, tier4]
        # `tier4` is deliberately NOT part of `all`: it is an explicit paid
        # multi-hour acceptance run (real herdr scout panes), never accidental.

# Phase 7 — concurrency control: cancel in-progress runs on the same
# ref when a new commit lands. Avoids wasting CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    name: Unit + e2e (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Phase 9 — Biome lint. Fails only on lint ERRORS (not warnings).
      # Warnings (e.g. unused imports) are tolerated to avoid blocking
      # PRs on legacy noise; clean them up opportunistically.
      - name: Biome lint
        run: npm run lint

      # Phase 6 housekeeping (2026-09-23) — biome format check. The
      # previous CI surface only ran biome lint, which allowed 138 format
      # errors to accumulate silently across pi-extension/src/. This step
      # mirrors a local `npx biome format pi-extension/src/` (without
      # --write) so future drift fails the build. Format is auto-fixable
      # via `biome format --write pi-extension/src/`.
      - name: Biome format check
        run: npx biome format pi-extension/src/

      - name: Build + unit tests
        run: npm test

      # DB-primary storage (Phase 1) — cheap integrity insurance on the
      # store databases produced by the unit tests. Full integrity_check
      # becomes a doctor SQL check in the Phase 7 doctor rewrite.
      - name: SQLite quick_check on store DBs
        run: node scripts/sqlite-quick-check.mjs

      # Phase 7 — coverage gate. Statement coverage must stay ≥ 92% (we're at
      # 94.40% post-Phase-6). The 2-point buffer prevents false-fail on
      # benign refactors. Update the threshold in Doc/test-coverage-baseline.md
      # if you intentionally raise the floor.
      - name: Coverage gate (statements >= 92%)
        run: |
          STMT=$(npm run test:coverage 2>&1 | grep "all files" | awk '{print $5}' | tr -d '%')
          echo "Statement coverage: $STMT%"
          awk -v s="$STMT" 'BEGIN { if (s+0 < 92) { print "FAIL: coverage " s "% < 92%"; exit 1 } else { print "PASS: coverage " s "% >= 92%" } }'

      - name: Install pi (for Tier 1 e2e)
        run: |
          if ! command -v pi >/dev/null 2>&1; then
            echo "Installing @earendil-works/pi-coding-agent@0.87.1..."
            npm install -g @earendil-works/pi-coding-agent@0.87.1 || echo "::warning::pi install failed; e2e will be skipped"
          fi

      - name: E2E Tier 1
        env:
          RUN_E2E: "1"
        run: RUN_E2E=1 npm run test:e2e

  # ---------------------------------------------------------------------
  # L3 — herdr-in-CI (herdr integration initiative, Phase 3).
  #
  # Proves velpari's multiplexer detection + brainstorm gate work inside a
  # REAL herdr pane, driven by the herdr CLI the same way the scout pattern
  # will drive it in Phase 4+.
  #
  # NAMING: this is "L3" in the herdr initiative's layer table (master plan
  # §5). It is NOT the "L3 — In-process" harness named in
  # Doc/testing-guide.md §1; the two vocabularies are unrelated.
  #
  # Windows is intentionally OUT of the matrix: herdr's Windows support is
  # preview-only (install.ps1 is an endpoint-protected preview endpoint) and
  # this project does not test Windows. Revisit at herdr Windows GA.
  herdr-l3:
    name: L3 herdr-in-CI (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all'
    needs: unit-and-e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: herdr version
        run: |
          herdr --version | tee -a "$GITHUB_STEP_SUMMARY"
      # Server start, health check, real pane, in-pane test run and stop all
      # live in ONE step: the pane inherits this step's environment (node on
      # PATH, repo cwd), and a failure never leaves a stray server behind.
      - name: L3 — detection + gate tests inside a real herdr pane
        run: |
          set -euo pipefail
          mkdir -p .tmp/herdr-l3
          LOG=.tmp/herdr-l3/server.log
          nohup herdr server >"$LOG" 2>&1 &
          # 1. Health check — bounded poll, because the socket can exist
          #    before the server finishes booting. NOTE: the not-yet-up
          #    status reads `status: not running`, so a bare
          #    `grep -i running` matches it and declares ready while the
          #    daemon is still booting (observed: the ubuntu leg raced
          #    ahead of the server and hit server_not_running). Exclude
          #    the negative string before accepting the positive one.
          ready=0
          for _ in $(seq 1 60); do
            STATUS="$(herdr status server 2>&1 || true)"
            printf '%s\n' "$STATUS"
            if ! printf '%s' "$STATUS" | grep -qi 'not running' \
              && printf '%s' "$STATUS" | grep -qiE 'running|ready|up|ok'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::herdr server did not report ready within 60s"
            cat "$LOG" || true
            exit 1
          fi
          herdr status server > .tmp/herdr-l3/status.txt 2>&1 || true
          # 2. Real workspace + pane (no focus steal), cwd = repo root.
          herdr workspace create --cwd "$PWD" --label velpari-l3 --no-focus > .tmp/herdr-l3/workspace.json
          PANE=$(node -e 'const j=JSON.parse(require("fs").readFileSync(".tmp/herdr-l3/workspace.json","utf8"));process.stdout.write(j.result.root_pane.pane_id)')
          echo "herdr pane: $PANE"
          # 3. Run the mux + gate test files INSIDE the pane. herdr injects
          #    HERDR_ENV / HERDR_PANE_ID into managed panes, so the run also
          #    proves the OP-7 ambient-env class cannot regress.
          herdr pane run "$PANE" "cd '$PWD' && RUN_HERDR_L3=1 node --test --test-force-exit dist/pi-extension/test/core/multiplexer.test.js dist/pi-extension/test/ops/brainstorm-multiplexer-gate.test.js dist/pi-extension/test/e2e/herdr-ambient.test.js; echo VELPARI_L3_EXIT=\$?"
          # 4. Poll the pane output for the sentinel. The typed command line
          #    itself contains `VELPARI_L3_EXIT=$?`, so only a value with at
          #    least one digit counts as the real result (otherwise the poll
          #    matches the echoed command and reads an empty exit code).
          found=0
          for _ in $(seq 1 90); do
            OUT="$(herdr pane read "$PANE" --source recent --lines 400 --format text 2>/dev/null || true)"
            if printf '%s' "$OUT" | grep -qE 'VELPARI_L3_EXIT=[0-9]+'; then found=1; break; fi
            sleep 2
          done
          printf '%s\n' "${OUT:-}" > .tmp/herdr-l3/pane-output.txt
          if [ "$found" -ne 1 ]; then
            echo "::error::in-pane test run did not finish within 180s"
            cat .tmp/herdr-l3/pane-output.txt
            exit 1
          fi
          CODE=$(printf '%s' "$OUT" | grep -oE 'VELPARI_L3_EXIT=[0-9]+' | tail -1 | cut -d= -f2)
          echo "in-pane exit code: $CODE"
          if [ -z "$CODE" ] || [ "$CODE" != "0" ]; then
            echo "::error::in-pane tests failed (exit $CODE)"
            cat .tmp/herdr-l3/pane-output.txt
            exit 1
          fi
          echo "--- in-pane output (last 30 lines) ---"
          tail -30 .tmp/herdr-l3/pane-output.txt
      - name: Stop herdr server
        if: always()
        run: herdr server stop || true
      - name: Upload herdr L3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-l3-${{ matrix.os }}
          path: .tmp/herdr-l3/

  perf:
    name: Performance budget (RUN_PERF=1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all'
    needs: unit-and-e2e
    # Phase 6 — perf runs on every PR and every push (was: test-merge only).
    # Budget failures are reported as a workflow_dispatch-style artifact
    # (continue-on-error) so they don't block PRs but show in the Actions
    # tab. The budget itself stays in RUN_PERF=1 mode so the default
    # `npm test` run is unaffected.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Perf budget
        run: RUN_PERF=1 node --test --test-force-exit --test-reporter=spec dist/pi-extension/test/performance/*.test.js
      - name: Upload perf log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-log
          path: |
            dist/pi-extension/test/performance/*.test.js
            .tmp/test-runs/

    # Phase 7 — on perf failure, comment on the PR so reviewers see it.
      - name: Comment on PR with perf budget delta
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = '⚠️ **Performance budget regression detected.**\n\n' +
              'The `perf` job failed in this PR. Review the [job logs](' +
              '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ' +
              'for the failing assertion. This is a soft failure (continue-on-error: true) so ' +
              'the PR can still be merged, but please investigate before merging.\n\n' +
              '_Budget files: `pi-extension/test/performance/*.test.ts`_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  tier2:
    name: Tier 2 LLM e2e (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'tier2' || github.event.inputs.job == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `test:e2e:tier2` runs the COMPILED suite directly (no build step inside
      # the script), so this job must build itself. Without this the glob
      # matches nothing on a fresh checkout and the job ends with 0 tests.
      - name: Build
        run: npm run build
      # Same convention as Tier 1: the e2e harness needs `pi` on PATH, and the
      # install is fail-soft so a registry outage degrades to skips, not a red
      # job. Without it every Tier 1-gated test skips (observed locally:
      # 58 tests, 4 pass, 54 skipped).
      - name: Install pi (for the e2e harness)
        run: |
          if ! command -v pi >/dev/null 2>&1; then
            echo "Installing @earendil-works/pi-coding-agent@0.87.1..."
            npm install -g @earendil-works/pi-coding-agent@0.87.1 || echo "::warning::pi install failed; e2e will be skipped"
          fi
      - name: Tier 2 (RUN_LLM_E2E=1)
        env:
          RUN_E2E: "1"
          RUN_LLM_E2E: "1"
          # The user must configure these secrets in repo settings.
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          if [ -z "$KIMI_API_KEY" ]; then
            echo "::warning::KIMI_API_KEY not set; Tier 2 will be skipped"
          fi
          npm run test:e2e:tier2
      - name: Tier 2 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-result
          path: |
            .tmp/tier2/
            dist/pi-extension/test/e2e/*.test.js

  tier3:
    name: Tier 3 full-sequence RPC e2e (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'tier3' || github.event.inputs.job == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pi + subagents plugin + cline provider + tmux
        run: |
          npm install -g @earendil-works/pi-coding-agent@0.87.1
          pi install git:github.com/HazAT/pi-interactive-subagents
          # cline provider extension — supplies the cline/cline-pass models
          # (not built into pi; local setups have it via pi packages).
          pi install npm:@maxpaulus/pi-cline
          sudo apt-get update && sudo apt-get install -y tmux
      - name: Seed cline-pass auth (OAuth credential from repo secret)
        env:
          CLINE_PASS_AUTH_JSON: ${{ secrets.CLINE_PASS_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.pi/agent"
          node -e "const fs=require('fs');const c=JSON.parse(process.env.CLINE_PASS_AUTH_JSON);fs.writeFileSync(process.env.HOME+'/.pi/agent/auth.json',JSON.stringify({'cline-pass':c},null,2));"
      - name: Tier 3 full-sequence run
        env:
          # 2026-10-09: cline-pass DeepSeek (paid ClinePass plan — small free
          # models proved too weak for the stage lifecycle, run 37965973660).
          # Free fallback: E2E_MODEL=cline-free/mimo-v2.6-flash + drop the
          # auth-seed step. Kimi fallback: KIMI_API_KEY env +
          # E2E_MODEL=kimi-coding/kimi-for-coding (see Doc/testing-guide.md).
          E2E_MODEL: cline-pass/deepseek-v4.1-flash
          PI_SUBAGENT_MUX: "tmux"
        run: |
          npm run test:e2e:tier3
      - name: Tier 3 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-result
          path: .tmp/tier3/

  # Tier 4 — full sequence with REAL herdr scout panes (manual dispatch ONLY).
  # Deliberately NOT part of `all`: a paid multi-hour acceptance run (cost gate —
  # one dispatch; a re-dispatch needs the user's word). This is the CI twin of the
  # local smoke (`.IDE_Plans/smoke/run-6/run-smoke.sh`, 2026-10-10): the harness
  # runs INSIDE a managed herdr pane, so the fork plugin splits real visible panes
  # for the 4 scouts at every scout stage (`E2E_SPAWN_SCOUTS=all`; first scout
  # stage strict, later stages recorded as informational).
  tier4:
    name: Tier 4 full-sequence herdr e2e (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'tier4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pi + herdr-capable subagents fork + cline provider + herdr
        run: |
          npm install -g @earendil-works/pi-coding-agent@0.87.1
          # Fork (Adi-Mudi) = upstream + the herdr mux backend; v3.8.2 carries the
          # stacked scout layout (one right column, parent pinned ~50%). Upstream
          # (HazAT) has no herdr backend.
          pi install git:github.com/Adi-Mudi/pi-interactive-subagents
          # cline provider extension — supplies the cline/cline-pass models
          # (not built into pi; local setups have it via pi packages).
          pi install npm:@maxpaulus/pi-cline
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          herdr --version
      - name: Seed cline-pass auth (OAuth credential from repo secret)
        env:
          CLINE_PASS_AUTH_JSON: ${{ secrets.CLINE_PASS_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.pi/agent"
          node -e "const fs=require('fs');const c=JSON.parse(process.env.CLINE_PASS_AUTH_JSON);fs.writeFileSync(process.env.HOME+'/.pi/agent/auth.json',JSON.stringify({'cline-pass':c},null,2));"
      - name: Seed default model in settings.json (tolerant merge)
        env:
          E2E_MODEL_DEFAULT: cline-pass/deepseek-v4.1-flash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const dir = os.homedir() + "/.pi/agent";
          const file = dir + "/settings.json";
          fs.mkdirSync(dir, { recursive: true });
          let settings = {};
          try {
            const parsed = JSON.parse(fs.readFileSync(file, "utf8"));
            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) settings = parsed;
          } catch { settings = {}; }
          const model = process.env.E2E_MODEL_DEFAULT;
          settings.defaultProvider = model.split("/")[0];
          settings.defaultModel = model;
          const enabled = Array.isArray(settings.enabledModels) ? settings.enabledModels : [];
          if (!enabled.includes(model)) enabled.push(model);
          settings.enabledModels = enabled;
          fs.writeFileSync(file, JSON.stringify(settings, null, 2));
          console.log("settings.json model keys seeded:", model);
          NODE
      - name: Model smoke pre-flight (fail fast on auth/model trouble)
        run: |
          pi --model cline-pass/deepseek-v4.1-flash -p "Reply with exactly: ok"
      - name: Tier 4 full-sequence run inside a herdr pane
        run: |
          set -euo pipefail
          mkdir -p .tmp/herdr-tier4
          LOG=.tmp/herdr-tier4/herdr-server.log
          nohup herdr server >"$LOG" 2>&1 &
          # Bounded health poll — same not-yet-up exclusion as herdr-l3 (a bare
          # `grep running` also matches the negative "status: not running").
          ready=0
          for _ in $(seq 1 60); do
            STATUS="$(herdr status server 2>&1 || true)"
            printf '%s\n' "$STATUS"
            if ! printf '%s' "$STATUS" | grep -qi 'not running' \
              && printf '%s' "$STATUS" | grep -qiE 'running|ready|up|ok'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::herdr server did not report ready within 60s"
            cat "$LOG" || true
            exit 1
          fi
          herdr status server > .tmp/herdr-tier4/status.txt 2>&1 || true
          # Real workspace + pane (no focus steal), cwd = repo root.
          herdr workspace create --cwd "$PWD" --label velpari-tier4 --no-focus > .tmp/herdr-tier4/workspace.json
          PANE=$(node -e 'const j=JSON.parse(require("fs").readFileSync(".tmp/herdr-tier4/workspace.json","utf8"));process.stdout.write(j.result.root_pane.pane_id)')
          echo "herdr pane: $PANE"
          # The whole sequence runs INSIDE the pane so the fork plugin can split
          # real herdr panes for the 4 scouts of every scout stage.
          herdr pane run "$PANE" "cd '$PWD' && PI_SUBAGENT_MUX=herdr E2E_MODEL=cline-pass/deepseek-v4.1-flash E2E_SPAWN_SCOUTS=all E2E_REPORT_ROOT=.tmp/tier4 npm run test:e2e:tier3; echo VELPARI_TIER4_EXIT=\$?"
          # Poll for the sentinel: 10 s cadence, ~4.9 h cap (harness stage
          # timeouts bound the real duration). The typed command line also
          # contains `VELPARI_TIER4_EXIT=$?`, so only a value with at least one
          # digit counts as the real result.
          found=0
          OUT=""
          for _ in $(seq 1 1700); do
            OUT="$(herdr pane read "$PANE" --source recent --lines 400 --format text 2>/dev/null || true)"
            if printf '%s' "$OUT" | grep -qE 'VELPARI_TIER4_EXIT=[0-9]+'; then found=1; break; fi
            sleep 10
          done
          printf '%s\n' "${OUT:-}" > .tmp/herdr-tier4/pane-output.txt
          if [ "$found" -ne 1 ]; then
            echo "::error::tier4 run did not finish within the cap"
            tail -60 .tmp/herdr-tier4/pane-output.txt
            exit 1
          fi
          CODE=$(printf '%s' "$OUT" | grep -oE 'VELPARI_TIER4_EXIT=[0-9]+' | tail -1 | cut -d= -f2)
          echo "tier4 harness exit code: $CODE"
          if [ -z "$CODE" ] || [ "$CODE" != "0" ]; then
            echo "::error::tier4 harness failed (exit $CODE)"
            tail -60 .tmp/herdr-tier4/pane-output.txt
            exit 1
          fi
          echo "--- in-pane output (last 30 lines) ---"
          tail -30 .tmp/herdr-tier4/pane-output.txt
      - name: Stop herdr server
        if: always()
        run: herdr server stop || true
      - name: Tier 4 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier4-result
          path: |
            .tmp/tier4/
            .tmp/herdr-tier4/