name: test

on:
  push:
    branches: [test-merge, development, main, dev-upgrade, bug-fix, SQL-DB, "velpari/**", "pi-velpari-wt-*", "herdr*"]
  pull_request:
    branches: [test-merge, development, main, dev-upgrade, bug-fix, SQL-DB, "velpari/**", "pi-velpari-wt-*", "herdr*"]
  workflow_dispatch:

# Phase 7 — concurrency control: cancel in-progress runs on the same
# ref when a new commit lands. Avoids wasting CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    name: Unit + e2e (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Phase 9 — Biome lint. Fails only on lint ERRORS (not warnings).
      # Warnings (e.g. unused imports) are tolerated to avoid blocking
      # PRs on legacy noise; clean them up opportunistically.
      - name: Biome lint
        run: npm run lint

      # Phase 6 housekeeping (2026-09-23) — biome format check. The
      # previous CI surface only ran biome lint, which allowed 138 format
      # errors to accumulate silently across pi-extension/src/. This step
      # mirrors a local `npx biome format pi-extension/src/` (without
      # --write) so future drift fails the build. Format is auto-fixable
      # via `biome format --write pi-extension/src/`.
      - name: Biome format check
        run: npx biome format pi-extension/src/

      - name: Build + unit tests
        run: npm test

      # DB-primary storage (Phase 1) — cheap integrity insurance on the
      # store databases produced by the unit tests. Full integrity_check
      # becomes a doctor SQL check in the Phase 7 doctor rewrite.
      - name: SQLite quick_check on store DBs
        run: node scripts/sqlite-quick-check.mjs

      # Phase 7 — coverage gate. Statement coverage must stay ≥ 92% (we're at
      # 94.40% post-Phase-6). The 2-point buffer prevents false-fail on
      # benign refactors. Update the threshold in Doc/test-coverage-baseline.md
      # if you intentionally raise the floor.
      - name: Coverage gate (statements >= 92%)
        run: |
          STMT=$(npm run test:coverage 2>&1 | grep "all files" | awk '{print $5}' | tr -d '%')
          echo "Statement coverage: $STMT%"
          awk -v s="$STMT" 'BEGIN { if (s+0 < 92) { print "FAIL: coverage " s "% < 92%"; exit 1 } else { print "PASS: coverage " s "% >= 92%" } }'

      - name: Install pi (for Tier 1 e2e)
        run: |
          if ! command -v pi >/dev/null 2>&1; then
            echo "Installing @earendil-works/pi-coding-agent@0.87.1..."
            npm install -g @earendil-works/pi-coding-agent@0.87.1 || echo "::warning::pi install failed; e2e will be skipped"
          fi

      - name: E2E Tier 1
        env:
          RUN_E2E: "1"
        run: RUN_E2E=1 npm run test:e2e

  # ---------------------------------------------------------------------
  # L3 — herdr-in-CI (herdr integration initiative, Phase 3).
  #
  # Proves velpari's multiplexer detection + brainstorm gate work inside a
  # REAL herdr pane, driven by the herdr CLI the same way the scout pattern
  # will drive it in Phase 4+.
  #
  # NAMING: this is "L3" in the herdr initiative's layer table (master plan
  # §5). It is NOT the "L3 — In-process" harness named in
  # Doc/testing-guide.md §1; the two vocabularies are unrelated.
  #
  # Windows is intentionally OUT of the matrix: herdr's Windows support is
  # preview-only (install.ps1 is an endpoint-protected preview endpoint) and
  # this project does not test Windows. Revisit at herdr Windows GA.
  herdr-l3:
    name: L3 herdr-in-CI (${{ matrix.os }})
    needs: unit-and-e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: herdr version
        run: |
          herdr --version | tee -a "$GITHUB_STEP_SUMMARY"
      # Server start, health check, real pane, in-pane test run and stop all
      # live in ONE step: the pane inherits this step's environment (node on
      # PATH, repo cwd), and a failure never leaves a stray server behind.
      - name: L3 — detection + gate tests inside a real herdr pane
        run: |
          set -euo pipefail
          mkdir -p .tmp/herdr-l3
          LOG=.tmp/herdr-l3/server.log
          nohup herdr server >"$LOG" 2>&1 &
          # 1. Health check — bounded poll, because the socket can exist
          #    before the server finishes booting.
          ready=0
          for _ in $(seq 1 30); do
            STATUS="$(herdr status server 2>&1 || true)"
            printf '%s\n' "$STATUS"
            if printf '%s' "$STATUS" | grep -qiE 'running|ready|up|ok'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::herdr server did not report ready within 30s"
            cat "$LOG" || true
            exit 1
          fi
          herdr status server > .tmp/herdr-l3/status.txt 2>&1 || true
          # 2. Real workspace + pane (no focus steal), cwd = repo root.
          herdr workspace create --cwd "$PWD" --label velpari-l3 --no-focus > .tmp/herdr-l3/workspace.json
          PANE=$(node -e 'const j=JSON.parse(require("fs").readFileSync(".tmp/herdr-l3/workspace.json","utf8"));process.stdout.write(j.result.root_pane.pane_id)')
          echo "herdr pane: $PANE"
          # 3. Run the mux + gate test files INSIDE the pane. herdr injects
          #    HERDR_ENV / HERDR_PANE_ID into managed panes, so the run also
          #    proves the OP-7 ambient-env class cannot regress.
          herdr pane run "$PANE" "cd '$PWD' && RUN_HERDR_L3=1 node --test --test-force-exit dist/pi-extension/test/core/multiplexer.test.js dist/pi-extension/test/ops/brainstorm-multiplexer-gate.test.js dist/pi-extension/test/e2e/herdr-ambient.test.js; echo VELPARI_L3_EXIT=\$?"
          # 4. Poll the pane output for the sentinel. The typed command line
          #    itself contains `VELPARI_L3_EXIT=$?`, so only a value with at
          #    least one digit counts as the real result (otherwise the poll
          #    matches the echoed command and reads an empty exit code).
          found=0
          for _ in $(seq 1 90); do
            OUT="$(herdr pane read "$PANE" --source recent --lines 400 --format text 2>/dev/null || true)"
            if printf '%s' "$OUT" | grep -qE 'VELPARI_L3_EXIT=[0-9]+'; then found=1; break; fi
            sleep 2
          done
          printf '%s\n' "${OUT:-}" > .tmp/herdr-l3/pane-output.txt
          if [ "$found" -ne 1 ]; then
            echo "::error::in-pane test run did not finish within 180s"
            cat .tmp/herdr-l3/pane-output.txt
            exit 1
          fi
          CODE=$(printf '%s' "$OUT" | grep -oE 'VELPARI_L3_EXIT=[0-9]+' | tail -1 | cut -d= -f2)
          echo "in-pane exit code: $CODE"
          if [ -z "$CODE" ] || [ "$CODE" != "0" ]; then
            echo "::error::in-pane tests failed (exit $CODE)"
            cat .tmp/herdr-l3/pane-output.txt
            exit 1
          fi
          echo "--- in-pane output (last 30 lines) ---"
          tail -30 .tmp/herdr-l3/pane-output.txt
      - name: Stop herdr server
        if: always()
        run: herdr server stop || true
      - name: Upload herdr L3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-l3-${{ matrix.os }}
          path: .tmp/herdr-l3/

  perf:
    name: Performance budget (RUN_PERF=1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-and-e2e
    # Phase 6 — perf runs on every PR and every push (was: test-merge only).
    # Budget failures are reported as a workflow_dispatch-style artifact
    # (continue-on-error) so they don't block PRs but show in the Actions
    # tab. The budget itself stays in RUN_PERF=1 mode so the default
    # `npm test` run is unaffected.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Perf budget
        run: RUN_PERF=1 node --test --test-force-exit --test-reporter=spec dist/pi-extension/test/performance/*.test.js
      - name: Upload perf log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-log
          path: |
            dist/pi-extension/test/performance/*.test.js
            .tmp/test-runs/

    # Phase 7 — on perf failure, comment on the PR so reviewers see it.
      - name: Comment on PR with perf budget delta
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = '⚠️ **Performance budget regression detected.**\n\n' +
              'The `perf` job failed in this PR. Review the [job logs](' +
              '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ' +
              'for the failing assertion. This is a soft failure (continue-on-error: true) so ' +
              'the PR can still be merged, but please investigate before merging.\n\n' +
              '_Budget files: `pi-extension/test/performance/*.test.ts`_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  tier2:
    name: Tier 2 LLM e2e (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build + Tier 2
        env:
          RUN_E2E: "1"
          RUN_LLM_E2E: "1"
          # The user must configure these secrets in repo settings.
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          if [ -z "$KIMI_API_KEY" ]; then
            echo "::warning::KIMI_API_KEY not set; Tier 2 will be skipped"
          fi
          npm run test:e2e:tier2
      - name: Tier 2 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-result
          path: |
            .tmp/tier2/
            dist/pi-extension/test/e2e/*.test.js

  tier3:
    name: Tier 3 full-sequence RPC e2e (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pi + subagents plugin + tmux
        run: |
          npm install -g @earendil-works/pi-coding-agent@0.87.1
          pi install git:github.com/HazAT/pi-interactive-subagents
          sudo apt-get update && sudo apt-get install -y tmux
      - name: Tier 3 full-sequence run
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          E2E_MODEL: kimi-coding/kimi-for-coding
          PI_SUBAGENT_MUX: "tmux"
        run: |
          if [ -z "$KIMI_API_KEY" ]; then
            echo "::warning::KIMI_API_KEY not set; Tier 3 skipped (add the secret and re-dispatch)"
            exit 0
          fi
          npm run test:e2e:tier3
      - name: Tier 3 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-result
          path: .tmp/tier3/