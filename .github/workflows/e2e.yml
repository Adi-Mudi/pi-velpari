name: e2e

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  schedule:
    # Nightly at 06:00 UTC. Tier 2 only — Tier 1 already runs on every PR.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tier2:
        description: "Run Tier 2 (real LLM, slower, costs API credits)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tier1:
    name: Tier 1 E2E (no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pi
        # pin to a version known to ship the `bash` RPC channel that the
        # doctor test uses to import the built runDoctor module
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Verify pi is reachable
        run: pi --version

      - name: Unit tests
        run: npm test

      - name: Tier 1 E2E
        # No LLM call is made by Tier 1 (registration + runDoctor via
        # bash RPC). The dummy key keeps pi happy at startup; tests
        # that would otherwise need a real key skip via tier1Enabled().
        # Script-level timeout is 180s; per-test timeouts are 60s.
        run: RUN_E2E=1 npm run test:e2e
        env:
          ANTHROPIC_API_KEY: "sk-ant-e2e-dummy-not-used"

      - name: Upload doctor report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: |
            .IDE_Plans/velpari/doctor-report.md

  tier2:
    name: Tier 2 E2E (real LLM)
    # Only run on nightly schedule, manual dispatch with tier2=true, or
    # when the PR carries the `e2e:llm` label. Never on every push.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier2) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e:llm'))
    needs: tier1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Tier 2 E2E
        # 300s per-test cap; scripts that need real LLM calls must
        # gate on tier2Enabled() / hasRealLlmKey() to skip cleanly
        # when the workflow is misconfigured.
        run: RUN_LLM_E2E=1 npm run test:e2e:tier2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-failures
          path: |
            .IDE_Plans/velpari/runs/
            .IDE_Plans/velpari/doctor-report.md
